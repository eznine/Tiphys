# Snippet included by the tiphys site (keeps Certbot SSL server block intact).
# APK check-update: short cache + CORS (Capacitor WebView / browsers).
# Native APK also uses CapacitorHttp which bypasses CORS.
location = /version.json {
    default_type application/json;
    add_header Cache-Control "no-cache, max-age=60" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
    try_files $uri =404;
}

# Manual APK downloads (versioned + tiphys.apk mirror).
location /apk/ {
    default_type application/octet-stream;
    add_header Content-Type "application/octet-stream" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Content-Type, Range" always;
    try_files $uri =404;
}
