# Reference tiphys.xyz site config.
# On the live origin, Certbot owns listen 443 / SSL lines — do NOT overwrite those.
# Deploy installs `nginx-tiphys-apk.conf` as a snippet and ensures:
#   include /etc/nginx/snippets/tiphys-apk.conf;
# inside the HTTPS server block.

server {
    listen 80;
    listen [::]:80;
    server_name tiphys.xyz www.tiphys.xyz;
    # Certbot typically redirects :80 → :443 on the live host.

    root /srv/tiphys-web;
    index index.html;
    client_max_body_size 128m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    include /etc/nginx/snippets/tiphys-apk.conf;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* \.wasm$ {
        try_files $uri =404;
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
