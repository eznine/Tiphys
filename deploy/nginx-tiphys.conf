server {
    listen 80;
    listen [::]:80;
    server_name tiphys.xyz www.tiphys.xyz;

    root /srv/tiphys-web;
    index index.html;
    client_max_body_size 128m;

    # SPA navigation can address any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # WebAssembly must not be served as application/octet-stream.
    location ~* \.wasm$ {
        try_files $uri =404;
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
