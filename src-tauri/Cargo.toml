[package]
name = "tiphys"
version = "0.1.0"
description = "TIPHYS — From Intent to Outcome"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tiphys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Startup-failure dialogs; rfd calls the native message box directly, so it
# works inside the setup hook before the event loop runs.
rfd = "0.15"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# panic=abort is safe now: expected startup failures exit through the rfd
# dialog in fail_startup() and never reach the builder's `.expect` panic.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
