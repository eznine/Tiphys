<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="tip-title">
  <title id="tip-title">TIPHYS mark</title>
  <desc>TIPHYS 图形标：蓝色折面与白色速度线，透明背景。</desc>
  <defs>

    <linearGradient id="tip-blue-cyan" gradientUnits="userSpaceOnUse" x1="320" y1="300" x2="425" y2="535">
      <stop stop-color="#0738c9"/>
      <stop offset=".30" stop-color="#0050e8"/>
      <stop offset=".50" stop-color="#008bfa"/>
      <stop offset=".63" stop-color="#00c4ef"/>
      <stop offset=".84" stop-color="#00e4ed"/>
      <stop offset="1" stop-color="#00e5ed"/>
    </linearGradient>
    <linearGradient id="tip-streak-highlight" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="240" y2="0">
      <stop stop-color="#dcefff" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#bfddff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#83baff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tip-streak-opacity" gradientUnits="userSpaceOnUse" x1="112" y1="0" x2="210" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".7" stop-color="white" stop-opacity=".9"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="tip-streak-fade" maskUnits="userSpaceOnUse" x="110" y="350" width="180" height="135">
      <rect x="110" y="350" width="180" height="135" fill="url(#streak-opacity)"/>
    </mask>
    <clipPath id="tip-upper-panel"><path d="M394 293L381 343L288 406H268L280 364H290Z"/></clipPath>
    <clipPath id="tip-lower-panel"><path d="M376 360L345 488L274 558L242 499L245 487L270 526L269 519L246 477L253 469L280 506L278 499L255 460L264 428L282 427Z"/></clipPath>
    <mask id="tip-head-slots" maskUnits="userSpaceOnUse" x="110" y="213" width="423" height="347">
      <rect x="110" y="213" width="423" height="347" fill="white"/>
      <path d="M110 251.5H309Q315 251.5 312 255.5Q311 258 308 258H110Z
               M110 267H268Q273 267 270 271.5Q269 273.5 266 273.5H110Z" fill="black"/>
    </mask>


  </defs>
  <g transform="translate(-170.82 -338.14) scale(1.65106)">
    <g id="speed-lines" mask="url(#tip-streak-fade)">
        <path d="M148 376L282 374V379Z" fill="url(#tip-blue-cyan)"/><path d="M148 376L282 374V379Z" fill="url(#tip-streak-highlight)"/><path d="M145 392L277 390L276 395Z" fill="url(#tip-blue-cyan)"/><path d="M145 392L277 390L276 395Z" fill="url(#tip-streak-highlight)"/><path d="M141 441L265 438L264 444Z" fill="url(#tip-blue-cyan)"/><path d="M141 441L265 438L264 444Z" fill="url(#tip-streak-highlight)"/><path d="M122 457L258 455L257 460Z" fill="url(#tip-blue-cyan)"/><path d="M122 457L258 455L257 460Z" fill="url(#tip-streak-highlight)"/><path d="M138 474L251 472L250 477Z" fill="url(#tip-blue-cyan)"/><path d="M138 474L251 472L250 477Z" fill="url(#tip-streak-highlight)"/>
      </g>
      <!-- Main panels: all structural edges are straight line segments. -->
      <g id="blue-body" fill="url(#tip-blue-cyan)">
        <path d="M394 293L381 343L288 406H268L280 364H290Z"/>
        <path d="M376 360L345 488L274 558L242 499L245 487L270 526L269 519L246 477L253 469L280 506L278 499L255 460L264 428L282 427Z"/>
      </g>
      <!-- Each panel has one continuous, evenly spaced vector grid. -->
      <g id="grid" fill="none" stroke="#b7f2ff" stroke-width=".72" stroke-opacity=".24">
        <path clip-path="url(#tip-upper-panel)" d="M220 237.00H410M220 256.00H410M220 275.00H410M220 294.00H410M220 313.00H410M220 332.00H410M220 351.00H410M220 370.00H410M220 389.00H410M220 408.00H410M220 427.00H410M220 446.00H410M220 465.00H410M220 484.00H410M220 503.00H410M220 522.00H410M220 541.00H410M220 560.00H410M220 579.00H410M220 598.00H410M149.60 285L82.40 565M169.60 285L102.40 565M189.60 285L122.40 565M209.60 285L142.40 565M229.60 285L162.40 565M249.60 285L182.40 565M269.60 285L202.40 565M289.60 285L222.40 565M309.60 285L242.40 565M329.60 285L262.40 565M349.60 285L282.40 565M369.60 285L302.40 565M389.60 285L322.40 565M409.60 285L342.40 565M429.60 285L362.40 565"/>
        <path clip-path="url(#tip-lower-panel)" d="M220 308.00H410M220 326.80H410M220 345.60H410M220 364.40H410M220 383.20H410M220 402.00H410M220 420.80H410M220 439.60H410M220 458.40H410M220 477.20H410M220 496.00H410M220 514.80H410M220 533.60H410M220 552.40H410M220 571.20H410M220 590.00H410M220 608.80H410M220 627.60H410M220 646.40H410M220 665.20H410M170.00 285L102.80 565M190.40 285L123.20 565M210.80 285L143.60 565M231.20 285L164.00 565M251.60 285L184.40 565M272.00 285L204.80 565M292.40 285L225.20 565M312.80 285L245.60 565M333.20 285L266.00 565M353.60 285L286.40 565M374.00 285L306.80 565M394.40 285L327.20 565M414.80 285L347.60 565M435.20 285L368.00 565M455.60 285L388.40 565"/>
      </g>
      <!-- White diagonal ribbons terminate in exact polygonal points. -->
      <g id="white-ribbons" fill="#fff">
        <path d="M160 409L286 407L381 341L380 347L289 412Z"/>
        <path d="M124 425L279 422L377 352L375 359L282 427Z"/>
      </g>
      <path id="inner-edge" d="M246 499L275 548L344 487"
            clip-path="url(#tip-lower-panel)" fill="none" stroke="#dcffff"
            stroke-width="2.3" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10"/>
      <!-- Only the intentional crown and horizontal slot endings are rounded. -->
      <g id="white-crown" fill="#fff" mask="url(#tip-head-slots)">
        <path d="M234 215H525Q533 215 528 222L497 262Q490 271 480 271H402Q398 271 394 274L353 301L350 314L397 282H480L471 289Q467 293 460 293H394L298 361Q295 364 287 364H234L176 361L286 359L317 339L320 327L283 350L299 293H178L225 222Q228 215 234 215Z"/>
        <path d="M156 250L211 249L210 253Z
                 M140 265L202 263.8L200 267.3Z
                 M112 279L193 276.5L191 280.3Z"/>
      </g>
  </g>
</svg>
